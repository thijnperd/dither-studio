<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dither Studio</title>
<!--
  The startup screen.

  Adam's arm reaches in from the left, God's from the right. When the two
  fingertips touch, Adam is dithered — his own pre-screened image is revealed
  over the painted one, spreading from the fingertip back along the arm — and
  starts to glow. God stays painted, so the moment reads as "the press takes
  this hand". The wordmark inks in underneath and the window opens.

  Three parts are meant to be replaced without touching the rest:

    1. THE HANDS   -> `HANDS` below: the three images (embedded as data URIs)
                      and the pixel position of each fingertip inside its own
                      image. `adam.dither` must be the same size as `adam.src`
                      and line up with it pixel for pixel. Swap an image, update
                      its `tip`, and the layout follows.
    2. THE TIMING  -> `T` below is the whole schedule in milliseconds, and
                      `SPLASH_MIN_MS` in electron/main.js is how long the window
                      waits before it opens; keep the two totals equal.
    3. THE INK     -> `--accent` and `INK` below: the light dots of the
                      dithered hand are recoloured to `INK`, its dark dots are
                      kept as drawn, and the glow is tinted to the accent.

  It is one self-contained document: the images are inlined, there is no font
  and nothing is fetched from disk, so it renders before any stylesheet or
  renderer exists. It also holds still when the system asks for reduced motion.

  The arms are always scaled to run off the left and right borders, so their
  cut ends are never seen, at any window size. The scale is rounded to whole
  device pixels per image pixel so the dither screen stays crisp.

  For tests, `?at=<ms>` freezes the timeline at that moment (used by
  DITHER_SPLASH_AT, which is how the stages are photographed). An absent or
  empty `at` plays the timeline; `?boot=<ms>` only ever lengthens its tail.

  Main-process contract: electron/main.js waits `SPLASH_MIN_MS` (2900 ms) after
  the splash is shown, then destroys it as the app window is revealed.
-->
<style>
  :root {
    /* The house palette (see src/styles/tokens.css), hard-coded on purpose:
       the splash renders before any stylesheet is loaded. */
    --ink: #07080b;
    --panel: #0c0e13;
    --line: #232936;
    --paper: #e9e7e2;
    --accent: #7aa2ff;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* The window is transparent and frameless: nothing here is selectable. */
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  .panel {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
    background:
      radial-gradient(120% 150% at 50% 26%, #14161e 0%, var(--panel) 58%, var(--ink) 100%);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.035);
    opacity: 0;
    animation: panel-in 180ms ease-out 60ms both;
  }

  @keyframes panel-in {
    from { opacity: 0; transform: scale(0.985); }
    to   { opacity: 1; transform: scale(1); }
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* The wordmark is real text, not pixels: canvas text would soften under the
     glow, and this is the one thing that must stay crisp. Its resting state is
     visible, and the script fades it in; if the script ever failed, the user
     would still see the finished screen. */
  .wordmark {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 30px;
    margin: 0;
    text-align: center;
    font: 500 15px/1 "Segoe UI", system-ui, -apple-system, sans-serif;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--paper);
    text-transform: uppercase;
    opacity: 1;
  }

  .wordmark .studio { color: var(--accent); }

  .track {
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 132px;
    height: 2px;
    margin-left: -66px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }

  .track .fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg,
      rgba(122, 162, 255, 0.15), var(--accent));
  }

  @media (prefers-reduced-motion: reduce) {
    .panel { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="panel">
    <canvas aria-hidden="true"></canvas>
    <p class="wordmark" role="img" aria-label="Dither Studio">
      <span>Dither</span> <span class="studio">Studio</span>
    </p>
    <div class="track" aria-hidden="true"><span class="fill"></span></div>
  </div>

<script>

  /* ---- the schedule, in milliseconds ------------------------------- */

  var T = {

    wordmark: [1930, 2320],  // the name inks in
    rule: [2060, 2600],      // the hairline fills
    settle: 2900             // everything is still

  var params = new URLSearchParams(location.search);
  // A freeze only when it really carries a number: the main process used to
  // pass `at=`, and reading that as "hold frame 0" froze the splash on launch.

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      tip: { x: 2, y: 90 }
    }
  };

  // The light dots of the dithered hand are recoloured to this, so they read
  // as the house ink on the dark panel. Dark dots keep the colour they were
  // drawn in.
  var INK = [238, 243, 255];

  // Where the fingertips meet, in panel fractions.
  var MEET = { x: 0.5, y: 0.43 };
  // How far each hand travels in, in CSS pixels, and the hair of space left
  // between the two tips at the touch (Michelangelo never quite closes it).
  var GAP = 30;
  var CONTACT = 1;
  // How far past the panel border the cut end of each arm must always sit.
  var BLEED = 16;

  var canvas = document.querySelector('canvas');
  var ctx = canvas.getContext('2d');
  var box = { w: 0, h: 0, dpr: 1 };
  var images = null;     // { adam, god, dither } once decoded
  var geometry = null;   // the hands, laid out for the current box
  var dithered = null;   // Adam's dithered image, recoloured to the ink
  var bloom = null;      // a blurred, tinted copy of its light dots

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function load(src) {
    var img = new Image();
    img.src = src;
    return (img.decode ? img.decode() : new Promise(function (ok, fail) {
      img.onload = ok;
      img.onerror = fail;
    })).then(function () { return img; });
  }

  /* ---- the ink ----------------------------------------------------- */

  // Recolour the dithered image once: light dots become the ink, dark dots
  // stay, and a second copy keeps only the light dots for the glow.
  function inkOf(img) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    var octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    var data = octx.getImageData(0, 0, w, h);
    var light = octx.createImageData(w, h);
    var d = data.data, l = light.data;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;
      var lum = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
      if (lum > 0.5) {
        d[i] = l[i] = INK[0];
        d[i + 1] = l[i + 1] = INK[1];
        d[i + 2] = l[i + 2] = INK[2];
        l[i + 3] = 255;
      }
    }
    octx.putImageData(data, 0, 0);

    var lightCanvas = document.createElement('canvas');
    lightCanvas.width = w;
    lightCanvas.height = h;
    lightCanvas.getContext('2d').putImageData(light, 0, 0);
    return { ink: off, light: lightCanvas };
  }

  // The glow: the light dots, blurred and tinted to the accent. Built at the
  // drawn size so the blur radius is in screen pixels.
  function bloomOf(source, w, h) {
    var pad = Math.round(24 * box.dpr);
    var off = document.createElement('canvas');
    off.width = Math.round(w * box.dpr) + pad * 2;
    off.height = Math.round(h * box.dpr) + pad * 2;
    var octx = off.getContext('2d');
    octx.filter = 'blur(' + Math.round(9 * box.dpr) + 'px)';
    octx.drawImage(source, pad, pad, Math.round(w * box.dpr), Math.round(h * box.dpr));
    octx.filter = 'none';
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = 'rgba(122, 162, 255, 0.92)';
    octx.fillRect(0, 0, off.width, off.height);
    return { canvas: off, pad: pad / box.dpr };
  }

  /* ---- sizing ------------------------------------------------------ */

  function layout() {
    var w = Math.max(320, Math.round(canvas.clientWidth || 560));
    var h = Math.max(180, Math.round(canvas.clientHeight || 280));
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    if (geometry && box.w === w && box.h === h && box.dpr === dpr) return geometry;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    box = { w: w, h: h, dpr: dpr };
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var mx = w * MEET.x;
    var my = h * MEET.y;
    var a = images.adam, g = images.god;
    var ta = HANDS.adam.tip, tg = HANDS.god.tip;

    // Each arm is cut off at the outer edge of its image, so both arms are
    // scaled until that cut sits past the panel border, even while the hands
    // are still pulled back by GAP. The scale is then rounded up to a whole
    // number of device pixels per image pixel (half steps at 1x), so the
    // dither screen stays crisp instead of being resampled into mush.
    var reach = Math.max(mx, w - mx) + GAP + BLEED;
    var need = Math.max(reach / ta.x, reach / (g.naturalWidth - tg.x));
    var step = 1 / Math.max(2, dpr);
    var scale = Math.max(step, Math.ceil(need / step - 1e-6) * step);

    var adam = {
      x: Math.round(mx - CONTACT / 2 - ta.x * scale),
      y: Math.round(my - ta.y * scale),
      w: a.naturalWidth * scale,
      h: a.naturalHeight * scale
    };
    var god = {
      x: Math.round(mx + CONTACT / 2 - tg.x * scale),
      y: Math.round(my - tg.y * scale),
      w: g.naturalWidth * scale,
      h: g.naturalHeight * scale
    };

    bloom = bloomOf(dithered.light, adam.w, adam.h);
    geometry = { mx: mx, my: my, scale: scale, adam: adam, god: god };
    return geometry;
  }

  /* ---- the frame --------------------------------------------------- */

  function paint(t) {
    var geo = layout();
    var A = geo.adam, G = geo.god;

    var approach = ease(clamp(t / T.approach[1], 0, 1));
    var shift = Math.round((1 - approach) * GAP);
    var wipe = clamp((t - T.wipe[0]) / (T.wipe[1] - T.wipe[0]), 0, 1);

    ctx.clearRect(0, 0, box.w, box.h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // God stays painted.
    ctx.drawImage(images.god, G.x + shift, G.y, G.w, G.h);

    // The untouched part of Adam stays painted; the wiped part is dots. The
    // wipe starts at the fingertip and runs back past the end of the arm.
    var edge = geo.mx - wipe * (geo.mx - A.x + 40);
    ctx.save();
    ctx.beginPath();
    ctx.rect(-80, -80, edge + 80, box.h + 160);
    ctx.clip();
    ctx.drawImage(images.adam, A.x - shift, A.y, A.w, A.h);
    ctx.restore();

    if (wipe > 0) {
      // Nearest-neighbour, so every dot lands on whole pixels.
      ctx.imageSmoothingEnabled = false;

      // The soft half-lit edge first, then the solid dots on top of it. The
      // clip is taken in panel space, before the hand's offset is applied, so
      // the wipe edge stays where the screen is closing rather than travelling
      // with the hand.
      ctx.save();
      ctx.clip(wipePath(edge + 12, 4));
      ctx.globalAlpha = 0.45;
      ctx.drawImage(dithered.ink, A.x - shift, A.y, A.w, A.h);
      ctx.restore();

      ctx.save();
      ctx.clip(wipePath(edge - 12, 1));
      ctx.drawImage(dithered.ink, A.x - shift, A.y, A.w, A.h);
      ctx.restore();

      ctx.imageSmoothingEnabled = true;
    }

    // The glow, once the screen has taken hold, following the wipe.
    var up = clamp((t - T.bloom[0]) / (T.bloom[1] - T.bloom[0]), 0, 1);
    var breath = clamp((t - T.pulse[0]) / (T.pulse[1] - T.pulse[0]), 0, 1);
    var glow = up * (0.5 + 0.85 * Math.sin(Math.PI * breath));
    if (glow > 0.001) {
      ctx.save();
      ctx.clip(wipePath(edge - 12, 1));
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp(glow, 0, 1) * 0.58;
      ctx.drawImage(bloom.canvas,
        A.x - shift - bloom.pad, A.y - bloom.pad,
        A.w + bloom.pad * 2, A.h + bloom.pad * 2);
      ctx.restore();
    }

    // The spark at the moment they touch.
    var sinceTouch = t - T.touch;
    if (sinceTouch > -40 && sinceTouch < 320) {
      var age = clamp((sinceTouch + 40) / 360, 0, 1);
      var r = 3 + age * 16;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - age) * 0.9;
      ctx.strokeStyle = 'rgba(196, 214, 255, 0.9)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(geo.mx, geo.my, r, 0, Math.PI * 2);
      ctx.stroke();
      var halo = ctx.createRadialGradient(geo.mx, geo.my, 0, geo.mx, geo.my, 12);
      halo.addColorStop(0, 'rgba(255,255,255,0.95)');
      halo.addColorStop(0.4, 'rgba(160,190,255,0.35)');
      halo.addColorStop(1, 'rgba(122,162,255,0)');
      ctx.globalAlpha = 1 - age * 0.7;
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(geo.mx, geo.my, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    word(t);
  }

  // A wavy vertical edge: a straight clip line reads as a shutter, and a wiggle
  // reads as a screen closing over the hand.
  function wipePath(edge, wobble) {
    var p = new Path2D();
    p.moveTo(edge, -40);
    for (var y = -40; y <= box.h + 40; y += 6) {
      p.lineTo(edge + Math.sin(y * 0.11) * wobble + Math.sin(y * 0.037) * wobble * 1.6, y);
    }
    p.lineTo(edge + box.w + 200, box.h + 40);
    p.lineTo(edge + box.w + 200, -40);
    p.closePath();
    return p;
  }

  /* ---- the wordmark and the hairline ------------------------------- */

  var wordEl = document.querySelector('.wordmark');
  var fillEl = document.querySelector('.fill');

  function word(t) {
    var w = t < T.wordmark[0] ? 0 : clamp((t - T.wordmark[0]) / (T.wordmark[1] - T.wordmark[0]), 0, 1);
    var r = t < T.rule[0] ? 0 : clamp((t - T.rule[0]) / (T.rule[1] - T.rule[0]), 0, 1);
    wordEl.style.opacity = String(w);
    wordEl.style.transform = 'translateY(' + (6 * (1 - w)).toFixed(2) + 'px)';
    fillEl.style.width = (r * 100).toFixed(1) + '%';
    fillEl.style.opacity = String(r);
  }

  /* ---- run --------------------------------------------------------- */

  // The images decode in a few milliseconds, under the panel's own fade-in.
  // The clock starts once they are ready, so the approach is never skipped.
  if (!REDUCED) word(0);

  Promise.all([
    load(HANDS.adam.src),
    load(HANDS.god.src),
    load(HANDS.adam.dither)
  ]).then(function (list) {
    images = { adam: list[0], god: list[1] };
    dithered = inkOf(list[2]);

    if (REDUCED) {
      // No motion, no sparks: the finished screen, held.
      paint(T.settle);
    } else if (HOLD !== null) {
      paint(HOLD);
    } else {
      var start = null;
      var tick = function (now) {
        if (start === null) start = now;
        var t = now - start;
        paint(t);
        // The loop stops on its own: a splash that keeps painting would keep
        // a core warm behind a window that is already open.
        if (t < T.settle) requestAnimationFrame(tick);
        else paint(T.settle);
      };
      requestAnimationFrame(tick);
    }
  }).catch(function () {
    // An image failed to decode: show the finished wordmark rather than a
    // blank panel.
    word(T.settle);
  });
}());
