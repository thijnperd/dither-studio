name: build

# Builds the desktop app on GitHub, so no installer has to be built by hand.
# Every push that touches the app or the shared engine runs the checks and then
# packages the platform it can: the Windows setup and portable exe, and the
# macOS disk images - arm64 for Apple silicon, x64 for Intel. Pushing a
# `v<version>` tag also attaches every artifact to that tag's GitHub release.
#
# Before anything is built the full code is checked: the engine tests, the
# desktop core tests, the tutorial's lesson data, the engine-copy sync check,
# and the smoke run that boots the real window and drives it. A broken commit
# never gets an installer.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'launcher/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The checks, in the order that fails fastest first.
      - name: The desktop engine copies are in step with the shared engine
        run: node desktop/tools/sync-renderer.js --check

      - name: Engine tests
        run: node launcher/test.js

      - name: Desktop core tests
        run: node desktop/tools/core.test.js

      # The tutorial's lesson data, held to its own rules: real panels, real
      # commands, and no step that is already done before the learner starts.
      - name: Desktop tour tests
        run: node desktop/tools/tour.test.js

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Smoke — boot, check, screenshot
        working-directory: desktop
        run: npm run smoke

      - name: Smoke — the save chain writes a proof
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          export DITHER_SMOKE_DIR="$RUNNER_TEMP"
          export DITHER_SMOKE_SAVE="$RUNNER_TEMP/proof.png"
          export DITHER_SMOKE_KEY=ctrl+s
          npm run smoke | tee "$RUNNER_TEMP/smoke.log"
          # The report proves the app wrote the proof (the harness stat'ed
          # the bytes itself); the shell then has to see it too. Poll for a
          # bounded moment instead of racing the writer's exit.
          for i in $(seq 1 20); do
            [ -s "$DITHER_SMOKE_SAVE" ] && break
            sleep 0.5
          done
          test -s "$DITHER_SMOKE_SAVE" || { echo "no proof was written"; ls -la "$RUNNER_TEMP"; exit 1; }
          grep -q '"savedFile":{' "$RUNNER_TEMP/smoke.log" || { echo "the report did not see the save"; exit 1; }
          ls -l "$DITHER_SMOKE_SAVE"

      # A release tag names the version in desktop/package.json. Catch the
      # mismatch here rather than shipping an installer with the wrong name.
      - name: The tag and the package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"
            exit 1
          }

      # The release notes are the changelog's section for this version, so a
      # tag with no section here would publish an empty release page. Catch it
      # before anything is built.
      - name: The changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $v' section"
            exit 1
          }

      - name: Build the installer and the portable exe
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: dither-studio-windows
          path: |
            desktop/dist/Dither-Studio-Setup-*.exe
            desktop/dist/Dither-Studio-*-portable.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The same DOM-free checks the Windows job runs. The smoke run - the half
      # that drives a real window - stays there: it is the same renderer on both
      # platforms, and a CI machine is the wrong place to find out that a window
      # server is having an off day.
      - name: The desktop engine copies are in step with the shared engine
        run: node desktop/tools/sync-renderer.js --check

      - name: Engine tests
        run: node launcher/test.js

      - name: Desktop core tests
        run: node desktop/tools/core.test.js

      - name: Desktop tour tests
        run: node desktop/tools/tour.test.js

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: The tag and the package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"
            exit 1
          }

      # The release notes are the changelog's section for this version, so a
      # tag with no section here would publish an empty release page. Catch it
      # before anything is built.
      - name: The changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $v' section"
            exit 1
          }

      # x64 and arm64, unsigned: CI holds no certificate, and `mac.identity` in
      # package.json is null, so electron-builder does not go looking for one.
      - name: Build the disk images
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: dither-studio-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect every build
        uses: actions/download-artifact@v4
        with:
          pattern: dither-studio-*
          path: dist
          merge-multiple: true

      # One job owns the release: the two platforms cannot race to create it,
      # and nothing is published until both of them are green.
      - name: Attach every build to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${TAG#v}"
          # The notes are the changelog's own section for this version, with the
          # platform and signing facts a downloader needs underneath it, so the
          # release page and CHANGELOG.md cannot drift apart.
          {
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d'
            printf '%s\n' \
              "" \
              "**Windows** — Dither-Studio-Setup-*.exe installs it; the portable exe runs it from anywhere with no install." \
              "" \
              "**macOS** — Dither-Studio-*-arm64.dmg is for Apple silicon, Dither-Studio-*-x64.dmg for Intel. Open the disk image and drag Dither Studio to Applications." \
              "" \
              "Neither build is signed, so Windows SmartScreen may warn on the first run (choose More info, then Run anyway), and macOS Gatekeeper will refuse a plain double-click of a downloaded app (right-click it and choose Open, or allow it under System Settings then Privacy & Security)."
          } > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "the notes came out empty"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Dither Studio $TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Dither Studio $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
