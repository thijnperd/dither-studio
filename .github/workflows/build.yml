name: build

# Builds the desktop app on GitHub, so no installer has to be built by hand.
# Every push that touches the app or the shared engine runs the checks and then
# packages the platform it can: the Windows setup and portable exe, and the
# macOS disk images and zip - arm64 for Apple silicon, x64 for Intel. Pushing a
# `v<version>` tag also attaches every artifact to that tag's GitHub release.
#
# Before anything is built the full code is checked: the engine tests, the
# desktop core tests, the tutorial's lesson data, the updater's release rules,
# the engine-copy sync check, and the smoke run that boots the real window and
# drives it. A broken commit never gets an installer.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'launcher/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The checks, in the order that fails fastest first.
      - name: The desktop engine copies are in step with the shared engine
        run: node desktop/tools/sync-renderer.js --check

      - name: Engine tests
        run: node launcher/test.js

      - name: Desktop core tests
        run: node desktop/tools/core.test.js

      # The tutorial's lesson data, held to its own rules: real panels, real
      # commands, and no step that is already done before the learner starts.
      - name: Desktop tour tests
        run: node desktop/tools/tour.test.js

      # Semver ordering, the asset for each platform, and the changelog text
      # the post-update dialog reads. These are pure Node, no window.
      - name: Updater release rules
        run: node desktop/tools/update.test.js

      # The checksum check that stands between a download and an installer:
      # valid, mismatched, missing, and a release with no sums file at all.
      - name: Updater integrity
        run: node desktop/tools/update-integrity.test.js

      # The shell's external-link allowlist: its own pages and Lospec open,
      # everything else asks, and nothing that is not http(s) opens.
      - name: External link policy
        run: node desktop/tools/external-links.test.js

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Smoke — boot, check, screenshot
        working-directory: desktop
        run: npm run smoke:all

      - name: Smoke — the save chain writes a proof
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          export DITHER_SMOKE_DIR="$RUNNER_TEMP"
          export DITHER_SMOKE_SAVE="$RUNNER_TEMP/proof.png"
          export DITHER_SMOKE_KEY=ctrl+s
          npm run smoke:all | tee "$RUNNER_TEMP/smoke.log"
          # The report proves the app wrote the proof (the harness stat'ed
          # the bytes itself); the shell then has to see it too. Poll for a
          # bounded moment instead of racing the writer's exit.
          for i in $(seq 1 20); do
            [ -s "$DITHER_SMOKE_SAVE" ] && break
            sleep 0.5
          done
          test -s "$DITHER_SMOKE_SAVE" || { echo "no proof was written"; ls -la "$RUNNER_TEMP"; exit 1; }
          grep -q '"savedFile":{' "$RUNNER_TEMP/smoke.log" || { echo "the report did not see the save"; exit 1; }
          ls -l "$DITHER_SMOKE_SAVE"

      # A release tag names the version in desktop/package.json. Catch the
      # mismatch here rather than shipping an installer with the wrong name.
      - name: The tag and the package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"
            exit 1
          }

      # The release notes are the changelog's section for this version, so a
      # tag with no section here would publish an empty release page. Catch it
      # before anything is built.
      - name: The changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $v' section"
            exit 1
          }

      # Signing is opt-in through secrets: a certificate signs both exes, and
      # with no secret the build is unsigned and says so on the release page.
      # The updater's checksum gate holds either way.
      - name: Build the installer and the portable exe
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run dist -- --publish never

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: dither-studio-windows
          path: |
            desktop/dist/Dither-Studio-Setup-*.exe
            desktop/dist/Dither-Studio-*-portable.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The same DOM-free checks the Windows job runs. The smoke run - the half
      # that drives a real window - stays there: it is the same renderer on both
      # platforms, and a CI machine is the wrong place to find out that a window
      # server is having an off day.
      - name: The desktop engine copies are in step with the shared engine
        run: node desktop/tools/sync-renderer.js --check

      - name: Engine tests
        run: node launcher/test.js

      - name: Desktop core tests
        run: node desktop/tools/core.test.js

      - name: Desktop tour tests
        run: node desktop/tools/tour.test.js

      # Semver ordering, the asset for each platform, and the changelog text
      # the post-update dialog reads. These are pure Node, no window.
      - name: Updater release rules
        run: node desktop/tools/update.test.js

      - name: Updater integrity
        run: node desktop/tools/update-integrity.test.js

      - name: External link policy
        run: node desktop/tools/external-links.test.js

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: The tag and the package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"
            exit 1
          }

      # The release notes are the changelog's section for this version, so a
      # tag with no section here would publish an empty release page. Catch it
      # before anything is built.
      - name: The changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $v' section"
            exit 1
          }

      # x64 and arm64. `mac.identity` is no longer pinned to null, so
      # electron-builder signs and hardens the bundle when a Developer ID is
      # present (CSC_LINK from the repository secrets) and notarizes it when
      # the Apple credentials are too; with no secrets it still builds, just
      # unsigned, which is what every release up to 1.0.1 was. The zip beside
      # each disk image is what the in-app updater replaces.
      - name: Build the disk images and zips
        working-directory: desktop
        shell: bash
        # The secrets are read under neutral names and only passed on as
        # CSC_LINK once they are known to be non-empty: electron-builder only
        # skips signing when CSC_LINK is null, so an empty one makes it try to
        # build a keychain from an empty path and fails the build.
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MAC_CERT_P12:-}" ]; then
            export CSC_LINK="$MAC_CERT_P12"
            export CSC_KEY_PASSWORD="${MAC_CERT_PASSWORD:-}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice title=Unsigned build::No signing certificate secret, so the app is built unsigned."
          fi
          args=(--publish never)
          if [ -n "${APPLE_ID:-}" ]; then
            args+=(-c.mac.notarize=true)
          fi
          if ! npm run dist:mac -- "${args[@]}" 2>&1 | tee /tmp/mac-build.log; then
            reason=$(grep -iE 'error|failed' /tmp/mac-build.log | tail -3 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=macOS packaging failed::${reason:-no error line in the build log}"
            exit 1
          fi

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: dither-studio-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The notes are read out of CHANGELOG.md, so this job needs the tree
      # as well as the artifacts: the build jobs check out, and until this
      # step existed the notes had no file to come from.
      - uses: actions/checkout@v4

      - name: Collect every build
        uses: actions/download-artifact@v4
        with:
          pattern: dither-studio-*
          path: dist
          merge-multiple: true

      # The updater will not install a byte it cannot check, so a release with
      # no sums file is a release nobody can update from. sha256sum's own
      # output format is what desktop/electron/update-integrity.js parses.
      - name: Write SHA256SUMS.txt beside the builds
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "no checksums were written"; exit 1; }
          cat SHA256SUMS.txt

      # One job owns the release: the two platforms cannot race to create it,
      # and nothing is published until both of them are green.
      - name: Attach every build to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${TAG#v}"
          # The notes are the changelog's own section for this version, with the
          # platform and signing facts a downloader needs underneath it, so the
          # release page and CHANGELOG.md cannot drift apart.
          {
            awk -v v="$version" '
              /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d'
            printf '%s\n' \
              "" \
              "**Windows** — Dither-Studio-Setup-*.exe installs it; the portable exe runs it from anywhere with no install." \
              "" \
              "**macOS** — Dither-Studio-*-arm64.dmg is for Apple silicon, Dither-Studio-*-x64.dmg for Intel. Open the disk image and drag Dither Studio to Applications. The matching .zip is what the app's built-in updater replaces itself with; you do not need to open it by hand." \
              "" \
              "**Checksums.** Every asset is listed in SHA256SUMS.txt, and the built-in updater refuses a download that does not match its published SHA-256." \
              "" \
              "Builds are signed and notarized when this repository holds the signing secrets (a macOS Developer ID certificate and Apple notarization credentials, a Windows code-signing certificate). Without them the builds are unsigned: Windows SmartScreen may warn on the first run (choose More info, then Run anyway), and macOS Gatekeeper will refuse a plain double-click (right-click the app and choose Open, or allow it under System Settings then Privacy & Security)."
          } > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "the notes came out empty"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Dither Studio $TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Dither Studio $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
