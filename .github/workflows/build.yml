name: build

# Builds the desktop app on GitHub, so the Windows installer no longer has to
# be built by hand. Every push that touches the app or the shared engine builds
# it and uploads the two executables as artifacts; pushing a `v<version>` tag
# also attaches them to that tag's GitHub release.
#
# Before anything is built the full code is checked: the engine tests, the
# desktop core tests, the engine-copy sync check, and the smoke run that boots
# the real window and drives it. A broken commit never gets an installer.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'launcher/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: desktop build (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The checks, in the order that fails fastest first.
      - name: The desktop engine copies are in step with the shared engine
        run: node desktop/tools/sync-renderer.js --check

      - name: Engine tests
        run: node launcher/test.js

      - name: Desktop core tests
        run: node desktop/tools/core.test.js

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Smoke — boot, check, screenshot
        working-directory: desktop
        run: npm run smoke

      - name: Smoke — the save chain writes a proof
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          export DITHER_SMOKE_DIR="$RUNNER_TEMP"
          export DITHER_SMOKE_SAVE="$RUNNER_TEMP/proof.png"
          export DITHER_SMOKE_KEY=ctrl+s
          npm run smoke | tee "$RUNNER_TEMP/smoke.log"
          test -s "$DITHER_SMOKE_SAVE" || { echo "no proof was written"; exit 1; }
          grep -q '"savedFile":{' "$RUNNER_TEMP/smoke.log" || { echo "the report did not see the save"; exit 1; }

      # A release tag names the version in desktop/package.json. Catch the
      # mismatch here rather than shipping an installer with the wrong name.
      - name: The tag and the package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $v"
            exit 1
          }

      - name: Build the installer and the portable exe
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: dither-studio-windows
          path: |
            desktop/dist/Dither-Studio-Setup-*.exe
            desktop/dist/Dither-Studio-*-portable.exe
          if-no-files-found: error
          retention-days: 14

      # On a version tag the executables become the release. Created if it does
      # not exist yet, updated in place if it does.
      - name: Attach the executables to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(desktop/dist/Dither-Studio-Setup-*.exe desktop/dist/Dither-Studio-*-portable.exe)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Dither Studio $GITHUB_REF_NAME" \
              --notes "Windows build of Dither Studio $GITHUB_REF_NAME.

          Take Dither-Studio-Setup-*.exe to install it, or the portable exe to
          run it from anywhere with no install. The executables are unsigned, so
          Windows SmartScreen may warn on the first run: choose 'More info' ->
          'Run anyway'."
          fi
